apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hello-node-vs
  namespace: demo
spec:
  hosts:
    - "*"
  gateways:
    - gateway
  http:
    - name: hello-node-route
      route:
        - destination:
            host: hello-node
            subset: hello-node-v1
          weight: 80
        - destination:
            host: hello-node
            subset: hello-node-v2
          weight: 20
