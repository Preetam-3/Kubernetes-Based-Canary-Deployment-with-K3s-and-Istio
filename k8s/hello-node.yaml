apiVersion: v1
kind: Service
metadata:
  name: hello-node
  labels:
    app: hello-node
spec:
  selector:
    app: hello-node
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-node
      version: v1
  template:
    metadata:
      labels:
        app: hello-node
        version: v1
    spec:
      containers:
        - name: hello-node
          image: hello-node:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-node
      version: v2
  template:
    metadata:
      labels:
        app: hello-node
        version: v2
    spec:
      containers:
        - name: hello-node
          image: hello-node:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
